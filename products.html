<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Katalog produk XWing Project"
    >

    <title>Katalog Produk</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="navbar">

        <div class="container navbar-content">

            <a
                href="index.html"
                class="brand"
            >

                XWing Project

            </a>


            <nav>

                <a
                    href="index.html"
                    id="nav-home"
                >

                    Home

                </a>


                <a
                    href="products.html"
                    id="nav-catalog"
                    class="active"
                >

                    Katalog

                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="container">


        <!-- =================================================
             LEVEL 1
             CATEGORY
        ================================================== -->

        <section
            id="categories-section"
            class="catalog-section"
        >

            <h2 class="section-title">

                Kategori Produk

            </h2>


            <div
                id="categories-grid"
                class="grid-container"
            >

                <div class="loading">

                    Memuat kategori...

                </div>

            </div>

        </section>



        <!-- =================================================
             LEVEL 2
             PRODUCTS
        ================================================== -->

        <section
            id="products-section"
            class="catalog-section hidden"
        >


            <!-- HEADER -->

            <div class="section-header">


                <button
                    id="back-button"
                    class="btn btn-secondary"
                >

                    &larr; Kembali ke Kategori

                </button>


                <h2
                    id="category-title"
                    class="section-title"
                >

                    Produk

                </h2>


            </div>



            <!-- =================================================
                 PRODUCTS GRID
            ================================================== -->

            <div
                id="products-grid"
                class="grid-container"
            >

                <div class="loading">

                    Memuat produk...

                </div>

            </div>



            <!-- =================================================
                 CATEGORY DESCRIPTION
            ================================================== -->

            <div
                id="category-description"
                class="category-description hidden"
            >


                <div
                    class="category-description-header"
                >

                    <div
                        class="category-description-icon"
                    >

                        i

                    </div>


                    <div>

                        <span
                            id="category-description-label"
                            class="category-description-label"
                        >

                            About This Collection

                        </span>


                        <h3
                            id="category-description-title"
                        >

                            Collection

                        </h3>

                    </div>

                </div>


                <div
                    class="category-description-text"
                >

                    <p
                        id="category-description-text"
                    >

                    </p>

                </div>

            </div>


        </section>


    </main>



    <!-- =====================================================
         IMAGE MODAL
    ====================================================== -->

    <div
        id="imageModal"
        class="image-modal"
    >

        <img
            id="modalImage"
            class="modal-content"
            src=""
            alt="Product"
        >

    </div>



    <!-- =====================================================
         APP
    ====================================================== -->

    <script
        type="module"
        src="js/app.js"
    ></script>


</body>

</html>
